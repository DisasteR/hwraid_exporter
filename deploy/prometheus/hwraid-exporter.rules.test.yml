# Tests des règles : promtool test rules hwraid-exporter.rules.test.yml
rule_files:
  - hwraid-exporter.rules.yml
evaluation_interval: 1m
tests:
  # Miroir dégradé puis en reconstruction ; un trou de lecture de 4 minutes
  # (séries d'état absentes) ne doit pas éteindre l'alerte.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_state{controller="serial:A",volume="b3",state="optimal"}'
        values: '1x4 _x40'
      # Trou de lecture de 16 à 20 min : l'exporter ne publie plus la série,
      # Prometheus la marque périmée (stale).
      - series: 'hwraid_volume_state{controller="serial:A",volume="b3",state="degraded"}'
        values: '_x5 1x9 stale _x3 1x10 _x15'
      - series: 'hwraid_volume_state{controller="serial:A",volume="b3",state="degraded_rebuilding"}'
        values: '_x30 1x14'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x14 0x4 1x26'
      - series: 'hwraid_snapshot_ready'
        values: '1x45'
    alert_rule_test:
      - eval_time: 3m
        alertname: HwraidVolumeDegraded
        exp_alerts: []
      - eval_time: 17m
        alertname: HwraidVolumeDegraded
        exp_alerts:
          - exp_labels: {severity: critical, controller: "serial:A", volume: "b3", state: degraded}
            exp_annotations:
              summary: "Volume RAID b3 dégradé, sans reconstruction (serial:A)"
              description: "Le volume fonctionne sans redondance. Remplacer le disque en panne ; une seconde panne dans ce volume serait fatale."
      - eval_time: 17m
        alertname: HwraidCollectionNeverSucceeded
        exp_alerts: []
      - eval_time: 44m
        alertname: HwraidVolumeRebuilding
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", volume: "b3", state: degraded_rebuilding}
            exp_annotations:
              summary: "Volume RAID b3 en reconstruction (serial:A)"
              description: "Redondance absente jusqu'à la fin de la reconstruction. Éviter toute intervention et toute coupure."
      - eval_time: 44m
        alertname: HwraidVolumeDegraded
        exp_alerts: []

  # Disque absent, volume en échec : alertes immédiates.
  - interval: 1m
    input_series:
      - series: 'hwraid_disk_state{controller="serial:A",disk="d7",state="failed"}'
        values: '1x5'
      - series: 'hwraid_volume_state{controller="serial:A",volume="b3",state="failed"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: HwraidDiskFailed
        exp_alerts:
          - exp_labels: {severity: critical, controller: "serial:A", disk: d7, state: failed}
            exp_annotations:
              summary: "Disque d7 en panne (serial:A)"
              description: "Disque membre d'un volume mais absent de la carte."
      - eval_time: 1m
        alertname: HwraidVolumeFailed
        exp_alerts:
          - exp_labels: {severity: critical, controller: "serial:A", volume: b3, state: failed}
            exp_annotations:
              summary: "Volume RAID b3 en échec (serial:A)"
              description: "Le volume a perdu plus de membres que sa redondance ne le permet : données inaccessibles ou perdues."

  # Protection du cache : panne après 5 min ; charge normale de 20 min sans
  # alerte ; lecture en échec prolongée signalée.
  - interval: 1m
    input_series:
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="failed"}'
        values: '1x10'
      - series: 'hwraid_cache_protection_state{controller="serial:B",state="charging"}'
        values: '1x20'
      - series: 'hwraid_collection_success{controller="serial:B",collector="cache_protection"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: HwraidCacheProtectionFailed
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", state: failed}
            exp_annotations:
              summary: "Protection du cache en panne (serial:A)"
              description: "Le module de protection du cache ne protège plus les données en attente d'écriture. Régler le cache d'écriture des volumes en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) pour qu'il reste coupé jusqu'au remplacement du module ; HwraidVolumeWriteCacheUnprotected signale un cache resté actif."
      - eval_time: 20m
        alertname: HwraidCacheProtectionNotReady
        exp_alerts: []
      - eval_time: 16m
        alertname: HwraidCollectionNeverSucceeded
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:B", collector: cache_protection}
            exp_annotations:
              summary: "Lecture cache_protection jamais réussie (serial:B)"
              description: "Depuis son démarrage, l'exporter n'a jamais réussi cette lecture. Voir le journal de l'exporter ; « cannot allocate memory » sur toutes les lectures signale probablement la réserve de commandes du pilote aacraid épuisée : avec le réglage par défaut du pilote, un redémarrage ne videra alors pas le cache de la carte ; lire docs/aacraid-defaut-pilote.md avant de redémarrer."

  # Volume disparu alors que la lecture réussit.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="b3",name="x",raid_level="raid1",vendor_level="1",parent=""}'
        values: '1x5 _x30'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x35'
    alert_rule_test:
      - eval_time: 3m
        alertname: HwraidVolumeDisappeared
        exp_alerts: []
      # Toujours signalé longtemps après la disparition.
      - eval_time: 34m
        alertname: HwraidVolumeDisappeared
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", volume: b3, name: x, raid_level: raid1, vendor_level: "1"}
            exp_annotations:
              summary: "Volume b3 disparu (serial:A)"
              description: "Le volume a été vu dans les dernières 24 heures et n'apparaît plus alors que la lecture des volumes réussit : suppression ou perte du volume."

  # Volume absent pendant une lecture en échec : pas de disparition.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="b3",name="x",raid_level="raid1",vendor_level="1",parent=""}'
        values: '1x5 _x20'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x5 0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HwraidVolumeDisappeared
        exp_alerts: []

  # Exporter absent.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 11m
        alertname: HwraidExporterAbsent
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "hwraid_exporter ne publie plus de métriques"
              description: "Exporter arrêté ou non collecté par Prometheus : aucune alerte RAID ne peut se déclencher."

  # Péremption adaptée à l'intervalle : dernier succès à t = 0 ; intervalle
  # de 60 s sur la carte A (alerte après 3 min + 1 min), de 600 s sur la
  # carte B (pas d'alerte à 20 min, alerte après 30 min + 1 min).
  - interval: 1m
    input_series:
      - series: 'hwraid_collection_last_success_timestamp_seconds{controller="serial:A",collector="volumes"}'
        values: '0x40'
      - series: 'hwraid_collection_interval_seconds{controller="serial:A"}'
        values: '60x40'
      - series: 'hwraid_collection_last_success_timestamp_seconds{controller="serial:B",collector="volumes"}'
        values: '0x40'
      - series: 'hwraid_collection_interval_seconds{controller="serial:B"}'
        values: '600x40'
    alert_rule_test:
      - eval_time: 3m
        alertname: HwraidCollectionStale
        exp_alerts: []
      - eval_time: 20m
        alertname: HwraidCollectionStale
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", collector: volumes}
            exp_annotations:
              summary: "Lecture volumes sans succès depuis plus de 3 cycles (serial:A)"
              description: "L'exporter ne parvient plus à lire cette information : les alertes d'état correspondantes ne peuvent plus se déclencher. Voir le journal de l'exporter ; « cannot allocate memory » sur toutes les lectures signale probablement la réserve de commandes du pilote aacraid épuisée : avec le réglage par défaut du pilote, un redémarrage ne videra alors pas le cache de la carte ; lire docs/aacraid-defaut-pilote.md avant de redémarrer."
      - eval_time: 32m
        alertname: HwraidCollectionStale
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", collector: volumes}
            exp_annotations:
              summary: "Lecture volumes sans succès depuis plus de 3 cycles (serial:A)"
              description: "L'exporter ne parvient plus à lire cette information : les alertes d'état correspondantes ne peuvent plus se déclencher. Voir le journal de l'exporter ; « cannot allocate memory » sur toutes les lectures signale probablement la réserve de commandes du pilote aacraid épuisée : avec le réglage par défaut du pilote, un redémarrage ne videra alors pas le cache de la carte ; lire docs/aacraid-defaut-pilote.md avant de redémarrer."
          - exp_labels: {severity: warning, controller: "serial:B", collector: volumes}
            exp_annotations:
              summary: "Lecture volumes sans succès depuis plus de 3 cycles (serial:B)"
              description: "L'exporter ne parvient plus à lire cette information : les alertes d'état correspondantes ne peuvent plus se déclencher. Voir le journal de l'exporter ; « cannot allocate memory » sur toutes les lectures signale probablement la réserve de commandes du pilote aacraid épuisée : avec le réglage par défaut du pilote, un redémarrage ne videra alors pas le cache de la carte ; lire docs/aacraid-defaut-pilote.md avant de redémarrer."
      - eval_time: 1m
        alertname: HwraidCollectionIntervalTooLong
        exp_alerts:
          - exp_labels: {severity: info, controller: "serial:B"}
            exp_annotations:
              summary: "Intervalle de collecte de 600 s : allonger les fenêtres des règles d'état (serial:B)"
              description: "Les règles d'état retiennent la dernière valeur connue sur 10 minutes, soit au moins deux cycles pour un intervalle de 5 minutes au plus. Au-delà, passer ces fenêtres à au moins deux fois l'intervalle."

  # État passager : un seul cycle « dégradé » puis optimal ne déclenche pas
  # d'alerte (le délai de 5 min porte sur l'état courant).
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_state{controller="serial:A",volume="b3",state="optimal"}'
        values: '1x2 stale 1x20'
      - series: 'hwraid_volume_state{controller="serial:A",volume="b3",state="degraded"}'
        values: '_x3 1 stale _x20'
      - series: 'hwraid_disk_state{controller="serial:A",disk="d7",state="online"}'
        values: '1x2 stale 1x20'
      - series: 'hwraid_disk_state{controller="serial:A",disk="d7",state="failed"}'
        values: '_x3 1 stale _x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: HwraidVolumeDegraded
        exp_alerts: []
      - eval_time: 6m
        alertname: HwraidDiskFailed
        exp_alerts: []

  # Deux hôtes publient le même identifiant de contrôleur : les jointures
  # ne les mélangent pas. Seul l'hôte a dépasse trois cycles.
  - interval: 1m
    input_series:
      - series: 'hwraid_collection_last_success_timestamp_seconds{job="hwraid",instance="a:9799",controller="pci:0000:01:00.0",collector="volumes"}'
        values: '0x20'
      - series: 'hwraid_collection_interval_seconds{job="hwraid",instance="a:9799",controller="pci:0000:01:00.0"}'
        values: '60x20'
      - series: 'hwraid_collection_last_success_timestamp_seconds{job="hwraid",instance="b:9799",controller="pci:0000:01:00.0",collector="volumes"}'
        values: '0+60x20'
      - series: 'hwraid_collection_interval_seconds{job="hwraid",instance="b:9799",controller="pci:0000:01:00.0"}'
        values: '60x20'
      - series: 'hwraid_volume_state{job="hwraid",instance="a:9799",controller="pci:0000:01:00.0",volume="1",state="degraded"}'
        values: '1 stale _x20'
      - series: 'hwraid_volume_state{job="hwraid",instance="b:9799",controller="pci:0000:01:00.0",volume="1",state="optimal"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: HwraidCollectionStale
        exp_alerts:
          - exp_labels: {severity: warning, job: hwraid, instance: "a:9799", controller: "pci:0000:01:00.0", collector: volumes}
            exp_annotations:
              summary: "Lecture volumes sans succès depuis plus de 3 cycles (pci:0000:01:00.0)"
              description: "L'exporter ne parvient plus à lire cette information : les alertes d'état correspondantes ne peuvent plus se déclencher. Voir le journal de l'exporter ; « cannot allocate memory » sur toutes les lectures signale probablement la réserve de commandes du pilote aacraid épuisée : avec le réglage par défaut du pilote, un redémarrage ne videra alors pas le cache de la carte ; lire docs/aacraid-defaut-pilote.md avant de redémarrer."
      # Trou de lecture sur a : la panne de a reste visible malgré le volume
      # optimal de même identifiant sur b.
      - eval_time: 6m
        alertname: HwraidVolumeDegraded
        exp_alerts:
          - exp_labels: {severity: critical, job: hwraid, instance: "a:9799", controller: "pci:0000:01:00.0", volume: "1", state: degraded}
            exp_annotations:
              summary: "Volume RAID 1 dégradé, sans reconstruction (pci:0000:01:00.0)"
              description: "Le volume fonctionne sans redondance. Remplacer le disque en panne ; une seconde panne dans ce volume serait fatale."

  # Contrôleur disparu alors que la découverte réussit ; découverte en
  # échec ; collecte jamais publiée ; exporter injoignable.
  - interval: 1m
    input_series:
      - series: 'hwraid_controller_info{job="hwraid",instance="a:9799",controller="serial:A",identity_source="serial",pci_address="0000:01:00.0",driver="aacraid",backend="aacraid",model="6805",firmware="x"}'
        values: '1x3 stale _x30'
      - series: 'hwraid_discovery_success{job="hwraid",instance="a:9799"}'
        values: '1x30'
      - series: 'hwraid_discovery_success{job="hwraid",instance="b:9799"}'
        values: '0x30'
      - series: 'hwraid_snapshot_ready{job="hwraid",instance="b:9799"}'
        values: '0x30'
      - series: 'hwraid_snapshot_ready{job="hwraid",instance="c:9799"}'
        values: '1x5 stale _x25'
      - series: 'up{job="hwraid",instance="c:9799"}'
        values: '1x5 0x25'
      - series: 'up{job="autre",instance="d:9100"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: HwraidControllerDisappeared
        exp_alerts:
          - exp_labels: {severity: warning, job: hwraid, instance: "a:9799", controller: "serial:A", identity_source: serial, pci_address: "0000:01:00.0", driver: aacraid, backend: aacraid, model: "6805", firmware: x}
            exp_annotations:
              summary: "Contrôleur serial:A disparu"
              description: "La carte a été vue dans les dernières 24 heures et n'est plus découverte : carte retirée, pilote déchargé ou identité changée."
      - eval_time: 16m
        alertname: HwraidDiscoveryFailed
        exp_alerts:
          - exp_labels: {severity: warning, job: hwraid, instance: "b:9799"}
            exp_annotations:
              summary: "Découverte des contrôleurs en échec (b:9799)"
              description: "L'exporter ne parvient pas à lire tout ou partie de l'inventaire sysfs : une carte peut ne plus être surveillée. Voir le journal de l'exporter."
      - eval_time: 11m
        alertname: HwraidSnapshotNotReady
        exp_alerts:
          - exp_labels: {severity: warning, job: hwraid, instance: "b:9799"}
            exp_annotations:
              summary: "Aucune collecte publiée (b:9799)"
              description: "L'exporter répond mais n'a encore publié aucun résultat de collecte. Voir le journal de l'exporter."
      - eval_time: 20m
        alertname: HwraidExporterDown
        exp_alerts:
          - exp_labels: {severity: warning, job: hwraid, instance: "c:9799"}
            exp_annotations:
              summary: "hwraid_exporter injoignable (c:9799)"
              description: "Prometheus ne collecte plus cet exporter : aucune alerte RAID de cet hôte ne peut se déclencher."

  # Pas de disparition : carte absente pendant une découverte en échec
  # (hôte e) ; mise à jour du firmware, qui change le label (hôte f).
  - interval: 1m
    input_series:
      - series: 'hwraid_controller_info{job="hwraid",instance="e:9799",controller="serial:E",identity_source="serial",pci_address="0000:01:00.0",driver="aacraid",backend="aacraid",model="6805",firmware="x"}'
        values: '1x3 stale _x20'
      - series: 'hwraid_discovery_success{job="hwraid",instance="e:9799"}'
        values: '1x3 0x20'
      - series: 'hwraid_controller_info{job="hwraid",instance="f:9799",controller="serial:F",identity_source="serial",pci_address="0000:01:00.0",driver="aacraid",backend="aacraid",model="6805",firmware="x"}'
        values: '1x3 stale _x20'
      - series: 'hwraid_controller_info{job="hwraid",instance="f:9799",controller="serial:F",identity_source="serial",pci_address="0000:01:00.0",driver="aacraid",backend="aacraid",model="6805",firmware="y"}'
        values: '_x4 1x20'
      - series: 'hwraid_discovery_success{job="hwraid",instance="f:9799"}'
        values: '1x24'
    alert_rule_test:
      - eval_time: 15m
        alertname: HwraidControllerDisappeared
        exp_alerts: []

  # Module de protection retiré : l'absence confirmée (present = 0) met fin
  # à l'alerte de panne sans attendre la fenêtre de 10 minutes.
  - interval: 1m
    input_series:
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="failed"}'
        values: '1x6 stale _x10'
      - series: 'hwraid_cache_protection_present{controller="serial:A",type="flash_supercap",vendor_type="zmm"}'
        values: '1x6 0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HwraidCacheProtectionFailed
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", state: failed}
            exp_annotations:
              summary: "Protection du cache en panne (serial:A)"
              description: "Le module de protection du cache ne protège plus les données en attente d'écriture. Régler le cache d'écriture des volumes en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) pour qu'il reste coupé jusqu'au remplacement du module ; HwraidVolumeWriteCacheUnprotected signale un cache resté actif."
      - eval_time: 9m
        alertname: HwraidCacheProtectionFailed
        exp_alerts: []

  # Carte sans module, nœud invalide, état de volume indéterminé : alerte
  # après le délai, puis retour à la normale.
  - interval: 1m
    input_series:
      - series: 'hwraid_controller_backend_supported{controller="pci:0000:05:00.0"}'
        values: '0x70 1x10'
      - series: 'hwraid_management_node_valid{controller="serial:A"}'
        values: '0x7 1x80'
      - series: 'hwraid_volume_state{controller="serial:A",volume="1d000000",state="unknown"}'
        values: '1x35 stale _x50'
      - series: 'hwraid_volume_state{controller="serial:A",volume="1d000000",state="optimal"}'
        values: '_x36 1x50'
    alert_rule_test:
      - eval_time: 4m
        alertname: HwraidManagementNodeInvalid
        exp_alerts: []
      - eval_time: 6m
        alertname: HwraidManagementNodeInvalid
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A"}
            exp_annotations:
              summary: "Nœud de gestion invalide (serial:A)"
              description: "Le nœud de gestion n'a pas pu être vérifié ou ne désigne pas la carte attendue (erreur de déploiement, carte changée). Aucune lecture n'est faite."
      - eval_time: 10m
        alertname: HwraidManagementNodeInvalid
        exp_alerts: []
      - eval_time: 29m
        alertname: HwraidVolumeStateUnknown
        exp_alerts: []
      - eval_time: 31m
        alertname: HwraidVolumeStateUnknown
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", volume: "1d000000", state: unknown}
            exp_annotations:
              summary: "État du volume 1d000000 non déterminé (serial:A)"
              description: "La carte a répondu mais l'état n'est pas interprétable avec certitude (type non qualifié, membre non optimal sur un assemblage). Vérifier les volumes membres et l'outil du constructeur."
      - eval_time: 40m
        alertname: HwraidVolumeStateUnknown
        exp_alerts: []
      - eval_time: 59m
        alertname: HwraidControllerUnsupported
        exp_alerts: []
      - eval_time: 61m
        alertname: HwraidControllerUnsupported
        exp_alerts:
          - exp_labels: {severity: info, controller: "pci:0000:05:00.0"}
            exp_annotations:
              summary: "Contrôleur pci:0000:05:00.0 non pris en charge"
              description: "Aucun module ne sait lire cette carte : son état n'est pas surveillé."
      - eval_time: 75m
        alertname: HwraidControllerUnsupported
        exp_alerts: []

  # État de la protection du cache non déterminé : alerte après 30 min.
  - interval: 1m
    input_series:
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="unknown"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 29m
        alertname: HwraidCacheProtectionStateUnknown
        exp_alerts: []
      - eval_time: 31m
        alertname: HwraidCacheProtectionStateUnknown
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", state: unknown}
            exp_annotations:
              summary: "État de la protection du cache non déterminé (serial:A)"
              description: "Le module répond avec une combinaison d'état non qualifiée : sa protection n'est pas garantie. Vérifier avec l'outil du constructeur."

  # Charge prolongée : alerte après 2 h, puis retour à la normale.
  - interval: 1m
    input_series:
      - series: 'hwraid_cache_protection_state{controller="serial:B",state="charging"}'
        values: '1x130 stale _x20'
      - series: 'hwraid_cache_protection_state{controller="serial:B",state="optimal"}'
        values: '_x131 1x20'
    alert_rule_test:
      - eval_time: 119m
        alertname: HwraidCacheProtectionNotReady
        exp_alerts: []
      - eval_time: 121m
        alertname: HwraidCacheProtectionNotReady
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:B", state: charging}
            exp_annotations:
              summary: "Protection du cache en charge depuis plus de 2 h (serial:B)"
              description: "Un module sain se charge en quelques minutes : une charge qui n'aboutit pas annonce une panne du module."
      - eval_time: 140m
        alertname: HwraidCacheProtectionNotReady
        exp_alerts: []

  # Cache d'écriture actif avec une protection en panne : alerte critique
  # sur le volume de premier niveau seulement, puis fin de l'alerte quand le
  # cache se coupe. Réglage forcé (wb) signalé, puis fin quand il passe en wbb.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x40'
      - series: 'hwraid_volume_info{controller="serial:A",volume="m1",name="Array0",raid_level="raid1",vendor_level="1",parent="v0"}'
        values: '1x40'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:A",volume="v0"}'
        values: '1x20 0x20'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:A",volume="m1"}'
        values: '1x20 0x20'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:A",volume="v0",policy="write_back_always",vendor_policy="Enabled"}'
        values: '1x20 stale _x19'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:A",volume="v0",policy="write_back_when_protected",vendor_policy="On when protected by battery/ZMM"}'
        values: '_x21 1x19'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:A",volume="m1",policy="write_back_always",vendor_policy="Enabled"}'
        values: '1x20 stale _x19'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x40'
      - series: 'hwraid_collection_success{controller="serial:A",collector="cache_protection"}'
        values: '1x40'
      - series: 'hwraid_cache_protection_present{controller="serial:A",type="flash_supercap",vendor_type="zmm"}'
        values: '1x40'
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="failed"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts: []
      - eval_time: 6m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts:
          - exp_labels: {severity: critical, controller: "serial:A", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture actif sans protection, volume v0 (serial:A)"
              description: "Le cache d'écriture du volume est actif alors que son module de protection est absent, en panne ou en charge : une coupure de courant, ou un redémarrage sans vidage du cache, perd les écritures en attente. Régler le cache en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) ou le désactiver."
      - eval_time: 16m
        alertname: HwraidVolumeWriteCacheAlwaysOn
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", volume: v0, policy: write_back_always, vendor_policy: Enabled}
            exp_annotations:
              summary: "Cache d'écriture forcé, volume v0 (serial:A)"
              description: "Le cache d'écriture reste actif même si le module de protection tombe en panne : une panne du module expose alors les écritures en attente. Préférer le mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb)."
      - eval_time: 25m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts: []
      - eval_time: 25m
        alertname: HwraidVolumeWriteCacheAlwaysOn
        exp_alerts: []
      - eval_time: 39m
        alertname: HwraidVolumeWriteCacheInactive
        exp_alerts: []

  # Lecture de la protection en échec de 6 à 20 min : la dernière panne
  # connue garde l'alerte 10 min. Module absent (B) : alerte ; en charge (C) : alerte.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x20'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:A",volume="v0"}'
        values: '1x20'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x20'
      - series: 'hwraid_collection_success{controller="serial:A",collector="cache_protection"}'
        values: '1x5 0x15'
      - series: 'hwraid_cache_protection_present{controller="serial:A",type="flash_supercap",vendor_type="zmm"}'
        values: '1x5 stale _x14'
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="failed"}'
        values: '1x5 stale _x14'
      - series: 'hwraid_volume_info{controller="serial:B",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x20'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:B",volume="v0"}'
        values: '1x20'
      - series: 'hwraid_collection_success{controller="serial:B",collector="volumes"}'
        values: '1x20'
      - series: 'hwraid_collection_success{controller="serial:B",collector="cache_protection"}'
        values: '1x20'
      - series: 'hwraid_cache_protection_present{controller="serial:B",type="battery",vendor_type="bbu"}'
        values: '0x20'
      - series: 'hwraid_volume_info{controller="serial:C",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x20'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:C",volume="v0"}'
        values: '1x20'
      - series: 'hwraid_collection_success{controller="serial:C",collector="volumes"}'
        values: '1x20'
      - series: 'hwraid_collection_success{controller="serial:C",collector="cache_protection"}'
        values: '1x20'
      - series: 'hwraid_cache_protection_present{controller="serial:C",type="flash_supercap",vendor_type="zmm"}'
        values: '1x20'
      - series: 'hwraid_cache_protection_state{controller="serial:C",state="charging"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts:
          - exp_labels: {severity: critical, controller: "serial:A", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture actif sans protection, volume v0 (serial:A)"
              description: "Le cache d'écriture du volume est actif alors que son module de protection est absent, en panne ou en charge : une coupure de courant, ou un redémarrage sans vidage du cache, perd les écritures en attente. Régler le cache en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) ou le désactiver."
          - exp_labels: {severity: critical, controller: "serial:B", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture actif sans protection, volume v0 (serial:B)"
              description: "Le cache d'écriture du volume est actif alors que son module de protection est absent, en panne ou en charge : une coupure de courant, ou un redémarrage sans vidage du cache, perd les écritures en attente. Régler le cache en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) ou le désactiver."
          - exp_labels: {severity: critical, controller: "serial:C", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture actif sans protection, volume v0 (serial:C)"
              description: "Le cache d'écriture du volume est actif alors que son module de protection est absent, en panne ou en charge : une coupure de courant, ou un redémarrage sans vidage du cache, perd les écritures en attente. Régler le cache en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) ou le désactiver."
      - eval_time: 19m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts:
          - exp_labels: {severity: critical, controller: "serial:B", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture actif sans protection, volume v0 (serial:B)"
              description: "Le cache d'écriture du volume est actif alors que son module de protection est absent, en panne ou en charge : une coupure de courant, ou un redémarrage sans vidage du cache, perd les écritures en attente. Régler le cache en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) ou le désactiver."
          - exp_labels: {severity: critical, controller: "serial:C", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture actif sans protection, volume v0 (serial:C)"
              description: "Le cache d'écriture du volume est actif alors que son module de protection est absent, en panne ou en charge : une coupure de courant, ou un redémarrage sans vidage du cache, perd les écritures en attente. Régler le cache en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) ou le désactiver."

  # Lecture des volumes en échec de 8 à 11 min (séries absentes) : l'alerte
  # critique et l'alerte de réglage forcé ne repartent pas de zéro.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x7 stale _x3 1x20'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:A",volume="v0"}'
        values: '1x7 stale _x3 1x20'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:A",volume="v0",policy="write_back_always",vendor_policy="Enabled"}'
        values: '1x7 stale _x3 1x20'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x7 0x4 1x20'
      - series: 'hwraid_collection_success{controller="serial:A",collector="cache_protection"}'
        values: '1x31'
      - series: 'hwraid_cache_protection_present{controller="serial:A",type="flash_supercap",vendor_type="zmm"}'
        values: '1x31'
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="failed"}'
        values: '1x31'
    alert_rule_test:
      - eval_time: 10m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts:
          - exp_labels: {severity: critical, controller: "serial:A", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture actif sans protection, volume v0 (serial:A)"
              description: "Le cache d'écriture du volume est actif alors que son module de protection est absent, en panne ou en charge : une coupure de courant, ou un redémarrage sans vidage du cache, perd les écritures en attente. Régler le cache en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) ou le désactiver."
      - eval_time: 16m
        alertname: HwraidVolumeWriteCacheAlwaysOn
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", volume: v0, policy: write_back_always, vendor_policy: Enabled}
            exp_annotations:
              summary: "Cache d'écriture forcé, volume v0 (serial:A)"
              description: "Le cache d'écriture reste actif même si le module de protection tombe en panne : une panne du module expose alors les écritures en attente. Préférer le mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb)."

  # Volume supprimé à 10 min, lecture réussie : l'alerte s'éteint aussitôt,
  # sans garder la dernière valeur.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x9 stale _x10'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:A",volume="v0"}'
        values: '1x9 stale _x10'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x20'
      - series: 'hwraid_collection_success{controller="serial:A",collector="cache_protection"}'
        values: '1x20'
      - series: 'hwraid_cache_protection_present{controller="serial:A",type="flash_supercap",vendor_type="zmm"}'
        values: '1x20'
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="failed"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts:
          - exp_labels: {severity: critical, controller: "serial:A", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture actif sans protection, volume v0 (serial:A)"
              description: "Le cache d'écriture du volume est actif alors que son module de protection est absent, en panne ou en charge : une coupure de courant, ou un redémarrage sans vidage du cache, perd les écritures en attente. Régler le cache en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) ou le désactiver."
      - eval_time: 11m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts: []

  # Protection redevenue opérationnelle, cache resté inactif : information
  # après 2 h, malgré une lecture de la protection en échec de 60 à 63 min ;
  # aucune alerte avec un réglage write_through, ni une fois le cache réactivé.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x200'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:A",volume="v0"}'
        values: '0x150 1x50'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:A",volume="v0",policy="write_back_when_protected",vendor_policy="On when protected by battery/ZMM"}'
        values: '1x200'
      - series: 'hwraid_volume_info{controller="serial:B",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x200'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:B",volume="v0"}'
        values: '0x200'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:B",volume="v0",policy="write_through",vendor_policy="Disabled"}'
        values: '1x200'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x200'
      - series: 'hwraid_collection_success{controller="serial:B",collector="volumes"}'
        values: '1x200'
      - series: 'hwraid_collection_success{controller="serial:A",collector="cache_protection"}'
        values: '1x59 0x3 1x137'
      - series: 'hwraid_collection_success{controller="serial:B",collector="cache_protection"}'
        values: '1x200'
      - series: 'hwraid_cache_protection_present{controller="serial:A",type="flash_supercap",vendor_type="zmm"}'
        values: '1x59 stale _x2 1x137'
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="optimal"}'
        values: '1x59 stale _x2 1x137'
      - series: 'hwraid_cache_protection_present{controller="serial:B",type="flash_supercap",vendor_type="zmm"}'
        values: '1x200'
      - series: 'hwraid_cache_protection_state{controller="serial:B",state="optimal"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 119m
        alertname: HwraidVolumeWriteCacheInactive
        exp_alerts: []
      - eval_time: 121m
        alertname: HwraidVolumeWriteCacheInactive
        exp_alerts:
          - exp_labels: {severity: info, controller: "serial:A", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture inactif malgré une protection opérationnelle, volume v0 (serial:A)"
              description: "Le réglage demande un cache d'écriture et le module de protection est opérationnel, mais la carte n'a pas réactivé le cache : écritures plus lentes. Vérifier l'état du cache avec l'outil du constructeur."
      - eval_time: 160m
        alertname: HwraidVolumeWriteCacheInactive
        exp_alerts: []
      - eval_time: 160m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts: []

  # Réglage « seulement si protégé », protection en panne : la carte coupe
  # le cache comme prévu, aucune alerte de cache.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x200'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:A",volume="v0"}'
        values: '0x200'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:A",volume="v0",policy="write_back_when_protected",vendor_policy="On when protected by battery/ZMM"}'
        values: '1x200'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x200'
      - series: 'hwraid_collection_success{controller="serial:A",collector="cache_protection"}'
        values: '1x200'
      - series: 'hwraid_cache_protection_present{controller="serial:A",type="flash_supercap",vendor_type="zmm"}'
        values: '1x200'
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="failed"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 150m
        alertname: HwraidVolumeWriteCacheInactive
        exp_alerts: []
      - eval_time: 150m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts: []
      - eval_time: 150m
        alertname: HwraidVolumeWriteCacheAlwaysOn
        exp_alerts: []
      - eval_time: 150m
        alertname: HwraidVolumeWriteCacheUnknown
        exp_alerts: []
      - eval_time: 150m
        alertname: HwraidVolumeWriteCacheProtectionUnknown
        exp_alerts: []

  # Cache actif, protection d'état non qualifié : avertissement distinct,
  # pas d'alerte critique.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x40'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:A",volume="v0"}'
        values: '1x40'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:A",volume="v0",policy="write_back_when_protected",vendor_policy="On when protected by battery/ZMM"}'
        values: '1x40'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x40'
      - series: 'hwraid_collection_success{controller="serial:A",collector="cache_protection"}'
        values: '1x40'
      - series: 'hwraid_cache_protection_present{controller="serial:A",type="flash_supercap",vendor_type="zmm"}'
        values: '1x40'
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="unknown"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 29m
        alertname: HwraidVolumeWriteCacheProtectionUnknown
        exp_alerts: []
      - eval_time: 31m
        alertname: HwraidVolumeWriteCacheProtectionUnknown
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture actif, protection d'état inconnu, volume v0 (serial:A)"
              description: "Le cache d'écriture du volume est actif et l'état du module de protection n'est pas qualifié ou ne peut pas être lu sur cette carte : rien ne garantit que les écritures en attente survivent à une coupure. Vérifier le module avec l'outil du constructeur."
      - eval_time: 31m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts: []

  # Lecture des volumes réussie, état du cache non reconnu (A) ou réglage
  # non reconnu (B) : avertissement ; rien pour un volume entièrement qualifié (C).
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x40'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:A",volume="v0",policy="write_back_when_protected",vendor_policy="On when protected by battery/ZMM"}'
        values: '1x40'
      - series: 'hwraid_volume_info{controller="serial:B",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x40'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:B",volume="v0",policy="unknown",vendor_policy="value 7"}'
        values: '1x40'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:B",volume="v0"}'
        values: '0x40'
      - series: 'hwraid_volume_info{controller="serial:C",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x40'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:C",volume="v0",policy="write_back_when_protected",vendor_policy="On when protected by battery/ZMM"}'
        values: '1x40'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:C",volume="v0"}'
        values: '0x40'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x40'
      - series: 'hwraid_collection_success{controller="serial:B",collector="volumes"}'
        values: '1x40'
      - series: 'hwraid_collection_success{controller="serial:C",collector="volumes"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 29m
        alertname: HwraidVolumeWriteCacheUnknown
        exp_alerts: []
      - eval_time: 31m
        alertname: HwraidVolumeWriteCacheUnknown
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", volume: v0}
            exp_annotations:
              summary: "Réglage ou état du cache d'écriture non reconnu, volume v0 (serial:A)"
              description: "La carte décrit le cache d'écriture du volume avec une valeur non qualifiée : les alertes de cache d'écriture ne couvrent plus ce volume. Vérifier le cache avec l'outil du constructeur."
          - exp_labels: {severity: warning, controller: "serial:B", volume: v0}
            exp_annotations:
              summary: "Réglage ou état du cache d'écriture non reconnu, volume v0 (serial:B)"
              description: "La carte décrit le cache d'écriture du volume avec une valeur non qualifiée : les alertes de cache d'écriture ne couvrent plus ce volume. Vérifier le cache avec l'outil du constructeur."

  # Protection en panne, puis optimale, puis lecture en échec : l'ancienne
  # panne n'est pas reprise (elle n'était pas dans la dernière lecture réussie).
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x30'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:A",volume="v0"}'
        values: '1x30'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x30'
      - series: 'hwraid_collection_last_success_timestamp_seconds{controller="serial:A",collector="volumes"}'
        values: '0+60x30'
      - series: 'hwraid_collection_success{controller="serial:A",collector="cache_protection"}'
        values: '1x14 0x16'
      - series: 'hwraid_collection_last_success_timestamp_seconds{controller="serial:A",collector="cache_protection"}'
        values: '0 60 120 180 240 300 360 420 480 540 600 660 720 780 840 840 840 840 840 840 840 840 840 840 840 840 840 840 840 840 840'
      - series: 'hwraid_cache_protection_present{controller="serial:A",type="flash_supercap",vendor_type="zmm"}'
        values: '1x14 stale _x15'
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="failed"}'
        values: '1x12 stale _x17'
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="optimal"}'
        values: '_x13 1x1 stale _x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts:
          - exp_labels: {severity: critical, controller: "serial:A", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture actif sans protection, volume v0 (serial:A)"
              description: "Le cache d'écriture du volume est actif alors que son module de protection est absent, en panne ou en charge : une coupure de courant, ou un redémarrage sans vidage du cache, perd les écritures en attente. Régler le cache en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) ou le désactiver."
      - eval_time: 21m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts: []

  # Volume supprimé lors d'une lecture réussie, puis lecture en échec : le
  # volume n'est pas repris.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x12 stale _x17'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:A",volume="v0"}'
        values: '1x12 stale _x17'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x14 0x16'
      - series: 'hwraid_collection_last_success_timestamp_seconds{controller="serial:A",collector="volumes"}'
        values: '0 60 120 180 240 300 360 420 480 540 600 660 720 780 840 840 840 840 840 840 840 840 840 840 840 840 840 840 840 840 840'
      - series: 'hwraid_collection_success{controller="serial:A",collector="cache_protection"}'
        values: '1x30'
      - series: 'hwraid_collection_last_success_timestamp_seconds{controller="serial:A",collector="cache_protection"}'
        values: '0+60x30'
      - series: 'hwraid_cache_protection_present{controller="serial:A",type="flash_supercap",vendor_type="zmm"}'
        values: '1x30'
      - series: 'hwraid_cache_protection_state{controller="serial:A",state="failed"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts:
          - exp_labels: {severity: critical, controller: "serial:A", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture actif sans protection, volume v0 (serial:A)"
              description: "Le cache d'écriture du volume est actif alors que son module de protection est absent, en panne ou en charge : une coupure de courant, ou un redémarrage sans vidage du cache, perd les écritures en attente. Régler le cache en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) ou le désactiver."
      - eval_time: 21m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts: []

  # Cache actif, collecteur de protection non pris en charge par la carte :
  # avertissement de protection inconnue.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x40'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:A",volume="v0"}'
        values: '1x40'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:A",volume="v0",policy="write_back_always",vendor_policy="Enabled"}'
        values: '1x40'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x40'
      - series: 'hwraid_collector_supported{controller="serial:A",collector="cache_protection"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: HwraidVolumeWriteCacheProtectionUnknown
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", volume: v0}
            exp_annotations:
              summary: "Cache d'écriture actif, protection d'état inconnu, volume v0 (serial:A)"
              description: "Le cache d'écriture du volume est actif et l'état du module de protection n'est pas qualifié ou ne peut pas être lu sur cette carte : rien ne garantit que les écritures en attente survivent à une coupure. Vérifier le module avec l'outil du constructeur."
      - eval_time: 31m
        alertname: HwraidVolumeWriteCacheUnprotected
        exp_alerts: []

  # État du cache non reconnu, lecture des volumes en échec de 10 à 12 min
  # (A), et réglage non reconnu dont la valeur brute change (B) : le délai
  # de l'alerte n'est pas remis à zéro.
  - interval: 1m
    input_series:
      - series: 'hwraid_volume_info{controller="serial:A",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x9 stale _x2 1x27'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:A",volume="v0",policy="write_back_when_protected",vendor_policy="On when protected by battery/ZMM"}'
        values: '1x9 stale _x2 1x27'
      - series: 'hwraid_collection_success{controller="serial:A",collector="volumes"}'
        values: '1x9 0x2 1x27'
      - series: 'hwraid_collection_last_success_timestamp_seconds{controller="serial:A",collector="volumes"}'
        values: '0 60 120 180 240 300 360 420 480 540 540 540 540 780 840 900 960 1020 1080 1140 1200 1260 1320 1380 1440 1500 1560 1620 1680 1740 1800 1860 1920 1980 2040 2100 2160 2220 2280 2340 2400'
      - series: 'hwraid_volume_info{controller="serial:B",volume="v0",name="Array0",raid_level="concat",vendor_level="RAID_volume",parent=""}'
        values: '1x40'
      - series: 'hwraid_volume_write_cache_enabled{controller="serial:B",volume="v0"}'
        values: '0x40'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:B",volume="v0",policy="unknown",vendor_policy="value 7"}'
        values: '1x15 stale _x23'
      - series: 'hwraid_volume_write_cache_policy{controller="serial:B",volume="v0",policy="unknown",vendor_policy="value 8"}'
        values: '_x16 1x23'
      - series: 'hwraid_collection_success{controller="serial:B",collector="volumes"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: HwraidVolumeWriteCacheUnknown
        exp_alerts:
          - exp_labels: {severity: warning, controller: "serial:A", volume: v0}
            exp_annotations:
              summary: "Réglage ou état du cache d'écriture non reconnu, volume v0 (serial:A)"
              description: "La carte décrit le cache d'écriture du volume avec une valeur non qualifiée : les alertes de cache d'écriture ne couvrent plus ce volume. Vérifier le cache avec l'outil du constructeur."
          - exp_labels: {severity: warning, controller: "serial:B", volume: v0}
            exp_annotations:
              summary: "Réglage ou état du cache d'écriture non reconnu, volume v0 (serial:B)"
              description: "La carte décrit le cache d'écriture du volume avec une valeur non qualifiée : les alertes de cache d'écriture ne couvrent plus ce volume. Vérifier le cache avec l'outil du constructeur."
