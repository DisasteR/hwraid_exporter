# Règles d'alerte d'exemple pour hwraid_exporter (docs/alerts.md).
#
# Trous de lecture : quand une lecture échoue, l'exporter retire les séries
# au lieu de publier une valeur non observée. Une alerte déjà déclenchée
# reste active 10 minutes après la disparition de sa condition
# (keep_firing_for) : elle ne s'éteint pas sur un échec passager, et aucune
# valeur non observée ne peut en déclencher une nouvelle. Le délai « for »
# d'une alerte pas encore déclenchée repart, lui, de zéro. Une lecture qui
# échoue durablement est signalée par HwraidCollectionStale.
# Limite : si la boucle de collecte se fige, l'exporter ressert sa dernière
# vue jusqu'à trois intervalles plus le délai de collecte ; une seule
# observation, bien réelle, peut alors remplir le « for » d'une alerte
# d'état (à partir d'un intervalle d'environ 2 min pour un « for » de 5 min).
# La boucle figée est signalée par hwraid_snapshot_ready 0 dès le premier
# scrape de la vue expirée (HwraidSnapshotNotReady), et par
# HwraidCollectionStale si cette alerte se déclenche avant l'expiration.
#
# Toutes les jointures portent job et instance : deux hôtes peuvent publier
# le même identifiant de contrôleur (pci:0000:01:00.0).
groups:
  - name: hwraid-etat
    rules:
      - alert: HwraidVolumeFailed
        expr: hwraid_volume_state{state="failed"} == 1
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Volume RAID {{ $labels.volume }} en échec ({{ $labels.controller }})"
          description: "Le volume a perdu plus de membres que sa redondance ne le permet : données probablement inaccessibles ou perdues. Pour un RAID 10 ou 50, si les pertes touchent des grappes différentes, les données peuvent rester accessibles : le vérifier avant toute restauration."

      - alert: HwraidVolumeDegraded
        expr: hwraid_volume_state{state="degraded"} == 1
        keep_firing_for: 10m
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Volume RAID {{ $labels.volume }} dégradé ({{ $labels.controller }})"
          description: "Le volume fonctionne sans redondance : un membre est perdu, ou l'état d'un membre est inconnu. Identifier le disque concerné (états des disques, outil du constructeur) et le remplacer s'il est en panne ; une panne de plus dans ce volume serait fatale."

      - alert: HwraidVolumeRebuilding
        expr: hwraid_volume_state{state="degraded_rebuilding"} == 1
        keep_firing_for: 10m
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Volume RAID {{ $labels.volume }} en reconstruction ({{ $labels.controller }})"
          description: "Redondance absente jusqu'à la fin de la reconstruction. Éviter toute intervention et toute coupure."

      - alert: HwraidVolumeRedundancyReduced
        expr: hwraid_volume_state{state=~"reduced_redundancy|reduced_redundancy_rebuilding"} == 1
        keep_firing_for: 10m
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Volume RAID {{ $labels.volume }} à redondance réduite ({{ $labels.controller }})"
          description: "Un volume à double redondance (RAID 6 ou 60) a perdu un membre ({{ $labels.state }}) ; ce RAID 6 ou 60 tolère encore une panne, mais si le volume alerté est un assemblage qui le contient, l'assemblage peut réunir des volumes moins redondants. En reduced_redundancy_rebuilding, laisser la reconstruction aboutir ; en reduced_redundancy, remplacer le disque en panne."

      - alert: HwraidVolumeStateUnknown
        expr: hwraid_volume_state{state="unknown"} == 1
        keep_firing_for: 10m
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "État du volume {{ $labels.volume }} non déterminé ({{ $labels.controller }})"
          description: "La carte a répondu mais l'état n'est pas interprétable avec certitude (niveau non établi, migration, drapeau de membre inconnu, assemblage incohérent). Vérifier les volumes membres et l'outil du constructeur."

      - alert: HwraidDiskFailed
        # Sans vendor_state : son passage à vide (lecture 248 en échec) ne
        # doit pas créer une seconde alerte pour le même disque.
        expr: max without (vendor_state) (hwraid_disk_state{state="failed"}) == 1
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disque {{ $labels.disk }} en panne ({{ $labels.controller }})"
          description: "Disque déclaré en panne par la carte, membre d'un volume mais absent, ou périphérique qui n'est pas un disque désigné par un volume."

      - alert: HwraidVolumeDisappeared
        # Volume vu dans les dernières 24 h, absent alors que la lecture des
        # volumes réussit. L'alerte dure 24 h : la mettre en silence après
        # une suppression volontaire. Une seule alerte par volume, même s'il a
        # changé de nom ou de niveau RAID dans la journée.
        expr: |
          (max by (job, instance, controller, volume) (last_over_time(hwraid_volume_info[1d]))
              unless on (job, instance, controller, volume) hwraid_volume_info)
          and on (job, instance, controller) hwraid_collection_success{collector="volumes"} == 1
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Volume {{ $labels.volume }} disparu ({{ $labels.controller }})"
          description: "Le volume a été vu dans les dernières 24 heures et n'apparaît plus alors que la lecture des volumes réussit : suppression ou perte du volume."

  - name: hwraid-protection-cache
    rules:
      - alert: HwraidCacheProtectionFailed
        expr: hwraid_cache_protection_state{state="failed"} == 1
        keep_firing_for: 10m
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Protection du cache en panne ({{ $labels.controller }})"
          description: "Le module de protection du cache ne protège plus les données en attente d'écriture. Régler le cache d'écriture des volumes en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) pour qu'il reste coupé jusqu'au remplacement du module ; HwraidVolumeWriteCacheUnprotected signale un cache resté actif."

      - alert: HwraidCacheProtectionNotReady
        expr: hwraid_cache_protection_state{state="charging"} == 1
        keep_firing_for: 10m
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Protection du cache en charge depuis plus de 2 h ({{ $labels.controller }})"
          description: "Un module sain se charge en quelques minutes : une charge qui n'aboutit pas annonce une panne du module."

      - alert: HwraidCacheProtectionStateUnknown
        expr: hwraid_cache_protection_state{state="unknown"} == 1
        keep_firing_for: 10m
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "État de la protection du cache non déterminé ({{ $labels.controller }})"
          description: "Le module répond avec une combinaison d'état non qualifiée : sa protection n'est pas garantie. Vérifier avec l'outil du constructeur."

      # Cache d'écriture : chaque volume est évalué, membres d'un assemblage
      # compris (le gestionnaire d'alertes les regroupe par contrôleur).
      - alert: HwraidVolumeWriteCacheUnprotected
        expr: |
          hwraid_volume_write_cache_enabled == 1
            and on (job, instance, controller) (
              hwraid_cache_protection_state{state=~"failed|charging"} == 1
              or hwraid_cache_protection_present == 0
            )
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Cache d'écriture actif sans protection, volume {{ $labels.volume }} ({{ $labels.controller }})"
          description: "Le cache d'écriture du volume est actif alors que son module de protection est absent, en panne ou en charge : une coupure de courant, ou un redémarrage sans vidage du cache, perd les écritures en attente. Régler le cache en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) ou le désactiver, puis vérifier sur chaque volume concerné, dans ARCCONF relu après le changement, « Write-cache status: Off » (un relevé de l'exporter peut dater d'avant le changement). Avant tout redémarrage, suivre le guide de déploiement (limite du pilote aacraid)."

      - alert: HwraidVolumeWriteCacheProtectionUnknown
        expr: |
          hwraid_volume_write_cache_enabled == 1
            and on (job, instance, controller) (
              hwraid_cache_protection_state{state="unknown"} == 1
              or hwraid_collector_supported{collector="cache_protection"} == 0
              or hwraid_collection_success{collector="cache_protection"} == 0
            )
        for: 30m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cache d'écriture actif, protection d'état inconnu, volume {{ $labels.volume }} ({{ $labels.controller }})"
          description: "Le cache d'écriture du volume est actif et l'état du module de protection n'est pas qualifié ou ne peut pas être lu sur cette carte : rien ne garantit que les écritures en attente survivent à une coupure. Vérifier le module avec l'outil du constructeur."

      - alert: HwraidVolumeWriteCacheUnknown
        # Réglage ou état du cache non reconnu : les autres alertes de cache
        # ne peuvent pas se déclencher. Une série par volume, quelle que soit
        # la valeur brute du réglage.
        expr: |
          max by (job, instance, controller, volume) (
            hwraid_volume_write_cache_policy{policy="unknown"} == 1
            or (hwraid_volume_write_cache_policy == 1
                unless on (job, instance, controller, volume) hwraid_volume_write_cache_enabled)
          )
        for: 30m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Réglage ou état du cache d'écriture non reconnu, volume {{ $labels.volume }} ({{ $labels.controller }})"
          description: "La carte décrit le réglage ou l'état du cache d'écriture du volume avec une valeur non qualifiée. État inconnu : HwraidVolumeWriteCacheUnprotected, HwraidVolumeWriteCacheProtectionUnknown et HwraidVolumeWriteCacheInactive ne peuvent plus se déclencher pour ce volume ; réglage inconnu : HwraidVolumeWriteCacheAlwaysOn et HwraidVolumeWriteCacheInactive. Vérifier le cache avec l'outil du constructeur."

      - alert: HwraidVolumeWriteCacheAlwaysOn
        expr: hwraid_volume_write_cache_policy{policy="write_back_always"} == 1
        for: 15m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cache d'écriture forcé, volume {{ $labels.volume }} ({{ $labels.controller }})"
          description: "Le cache d'écriture reste actif même si le module de protection tombe en panne : une panne du module expose alors les écritures en attente. Préférer le mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb)."

      - alert: HwraidVolumeWriteCacheInactive
        expr: |
          hwraid_volume_write_cache_enabled == 0
            and on (job, instance, controller, volume)
              hwraid_volume_write_cache_policy{policy=~"write_back_always|write_back_when_protected"} == 1
            and on (job, instance, controller) hwraid_cache_protection_state{state="optimal"} == 1
        for: 2h
        keep_firing_for: 10m
        labels:
          severity: info
        annotations:
          summary: "Cache d'écriture inactif malgré une protection opérationnelle, volume {{ $labels.volume }} ({{ $labels.controller }})"
          description: "Le réglage demande un cache d'écriture et le module de protection est opérationnel, mais la carte n'a pas réactivé le cache : écritures plus lentes. Vérifier l'état du cache avec l'outil du constructeur."

  - name: hwraid-temperature
    rules:
      # Seuils d'exploitation (55 et 60 °C) : à adapter à la ventilation du
      # boîtier. Le seuil haut annoncé par la carte (100 °C sur la 6805) est
      # une limite matérielle : l'outil du constructeur déclare l'état
      # anormal à partir de ce seuil, d'où l'alerte critique.
      - alert: HwraidControllerTemperatureHigh
        expr: hwraid_controller_temperature_celsius >= 55 < 60
        for: 10m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Contrôleur à {{ $value }} °C ({{ $labels.controller }})"
          description: "La température du contrôleur atteint au moins 55 °C depuis 10 minutes. Vérifier la ventilation du boîtier et l'encrassement du dissipateur de la carte."

      - alert: HwraidControllerTemperatureCritical
        expr: |
          hwraid_controller_temperature_celsius >= 60
            or
          hwraid_controller_temperature_celsius
            >= on (job, instance, controller) hwraid_controller_temperature_threshold_celsius{level="high"}
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Contrôleur à {{ $value }} °C ({{ $labels.controller }})"
          description: "La température du contrôleur atteint 60 °C, ou le seuil haut annoncé par la carte (état anormal pour l'outil du constructeur). Une surchauffe peut provoquer des erreurs ou l'arrêt de la carte : rétablir la ventilation sans attendre."

  - name: hwraid-visibilite
    rules:
      - alert: HwraidCollectionStale
        # S'adapte à l'intervalle configuré : aucun succès depuis plus de
        # trois cycles de collecte (lecture en échec ou hors délai). Un
        # collecteur devenu non pris en charge n'est pas en retard.
        expr: |
          (time() - hwraid_collection_last_success_timestamp_seconds
            > on (job, instance, controller) group_left 3 * hwraid_collection_interval_seconds)
            unless on (job, instance, controller, collector) hwraid_collector_supported == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Lecture {{ $labels.collector }} sans succès depuis plus de 3 cycles ({{ $labels.controller }})"
          description: "L'exporter ne parvient plus à lire cette information : les alertes d'état correspondantes ne peuvent plus se déclencher. Voir le journal de l'exporter ; « cannot allocate memory » sur toutes les lectures signale probablement la réserve de commandes du pilote aacraid épuisée : avec le réglage par défaut du pilote, un redémarrage ne videra alors pas le cache de la carte ; lire docs/aacraid-defaut-pilote.md avant de redémarrer."

      - alert: HwraidCollectionIntermittent
        # Des échecs entre des succès remettent à zéro le délai « for » des
        # autres alertes, qui peuvent alors ne jamais se déclencher, sans que
        # HwraidCollectionStale ne le voie (un échec encadré compte deux
        # passages). Deux fenêtres : au moins six passages en une heure
        # (environ trois échecs), pour les délais courts ; au moins quatre en
        # quatre heures (deux échecs), pour les délais jusqu'à 2 h
        # (HwraidCacheProtectionNotReady, HwraidVolumeWriteCacheInactive),
        # qu'un échec toutes les deux heures suffit à remettre à zéro.
        # La série doit exister à l'instant : un collecteur devenu non pris
        # en charge, ou un exporter arrêté, ne garde pas l'alerte sur ses
        # seuls échantillons passés.
        expr: |
          (changes(hwraid_collection_success[1h]) >= 6 or changes(hwraid_collection_success[4h]) >= 4)
            and on (job, instance, controller, collector) hwraid_collection_success
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lecture {{ $labels.collector }} en échec intermittent ({{ $labels.controller }})"
          description: "La lecture échoue régulièrement, entre des succès (trois fois en une heure, ou deux fois en quatre heures) : les alertes d'état qui demandent une condition continue (for), jusqu'à 2 h, peuvent ne jamais se déclencher. Vérifier l'état de la carte avec l'outil du constructeur et consulter le journal de l'exporter (délais dépassés, autre outil interrogeant la carte en même temps)."

      - alert: HwraidCollectionNeverSucceeded
        # Lecture en échec qui n'a jamais réussi depuis le démarrage (pas de
        # date de dernier succès).
        expr: |
          hwraid_collection_success == 0
            unless on (job, instance, controller, collector) hwraid_collection_last_success_timestamp_seconds
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Lecture {{ $labels.collector }} jamais réussie ({{ $labels.controller }})"
          description: "Depuis son démarrage, l'exporter n'a jamais réussi cette lecture. Voir le journal de l'exporter ; « cannot allocate memory » sur toutes les lectures signale probablement la réserve de commandes du pilote aacraid épuisée : avec le réglage par défaut du pilote, un redémarrage ne videra alors pas le cache de la carte ; lire docs/aacraid-defaut-pilote.md avant de redémarrer."

      - alert: HwraidCollectionIntervalTooLong
        # Les alertes déclenchées restent actives 10 min sans leur condition
        # (keep_firing_for) : elles ne couvrent un cycle en échec que si
        # l'intervalle est d'au plus 5 min.
        expr: hwraid_collection_interval_seconds > 300
        labels:
          severity: info
        annotations:
          summary: "Intervalle de collecte de {{ $value }} s : allonger keep_firing_for ({{ $labels.controller }})"
          description: "Les alertes d'état restent actives 10 minutes après la disparition de leur condition (keep_firing_for), soit au moins deux cycles pour un intervalle de 5 minutes au plus. Au-delà, passer keep_firing_for à au moins deux fois l'intervalle."

      - alert: HwraidManagementNodeInvalid
        expr: hwraid_management_node_valid == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nœud de gestion invalide ({{ $labels.controller }})"
          description: "Le nœud de gestion n'a pas pu être vérifié ou ne désigne pas la carte attendue (erreur de déploiement, carte changée). Aucune lecture n'est faite."

      - alert: HwraidControllerUnsupported
        expr: hwraid_controller_backend_supported == 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Contrôleur {{ $labels.controller }} non pris en charge"
          description: "Aucun module ne sait lire cette carte : son état n'est pas surveillé."

      - alert: HwraidVolumesNotMonitored
        # Carte reconnue par un module (backend pris en charge), mais dont les
        # volumes ne sont pas lus : modèle non qualifié sans -allow-unqualified,
        # lectures d'état non annoncées par la 706, ou forme non implémentée. Ni HwraidControllerUnsupported ni HwraidCollectionStale
        # ne le signalent.
        expr: hwraid_collector_supported{collector="volumes"} == 0
        for: 1h
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "État des volumes non surveillé ({{ $labels.controller }})"
          description: "Le module reconnaît la carte, mais ne lit pas ses volumes : modèle non qualifié sans l'option -allow-unqualified (hwraid_controller_qualified 0), carte qui n'annonce pas les lectures d'état dans sa réponse de capacités (706), ou forme de transfert non implémentée. Une panne de volume ne déclenchera aucune alerte. Vérifier hwraid_controller_qualified et la table des modèles qualifiés (docs/aacraid-interface.md, section 8) ; surveiller la carte avec l'outil du constructeur en attendant."

      - alert: HwraidControllerDisappeared
        # Contrôleur vu dans les dernières 24 h, absent alors que la
        # découverte réussit. Un changement d'identité (numéro de série
        # devenu illisible au démarrage) le déclenche aussi. Une seule alerte
        # par contrôleur, même après une mise à jour du firmware.
        expr: |
          (max by (job, instance, controller) (last_over_time(hwraid_controller_info[1d]))
              unless on (job, instance, controller) hwraid_controller_info)
          and on (job, instance) hwraid_discovery_success == 1
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Contrôleur {{ $labels.controller }} disparu"
          description: "La carte a été vue dans les dernières 24 heures et n'est plus découverte : carte retirée, pilote déchargé ou identité changée."

      - alert: HwraidDiscoveryFailed
        expr: hwraid_discovery_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Découverte des contrôleurs en échec ({{ $labels.instance }})"
          description: "L'exporter ne parvient pas à lire tout ou partie de l'inventaire sysfs : une carte peut ne plus être surveillée. Voir le journal de l'exporter."

      - alert: HwraidSnapshotNotReady
        expr: hwraid_snapshot_ready == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Aucune collecte servie ({{ $labels.instance }})"
          description: "L'exporter répond mais ne sert aucun résultat de collecte : pas encore de collecte publiée, arrêt en cours (attente d'une commande de la carte), ou boucle de collecte qui ne publie plus. Voir le journal de l'exporter."

      - alert: HwraidExporterDown
        # Instance qui a publié des métriques hwraid dans les dernières 24 h
        # et que Prometheus n'arrive plus à collecter. Une cible retirée de
        # la configuration de Prometheus n'a plus de série up : elle n'est
        # pas vue par cette règle.
        expr: up == 0 and on (job, instance) last_over_time(hwraid_snapshot_ready[1d])
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "hwraid_exporter injoignable ({{ $labels.instance }})"
          description: "Prometheus ne collecte plus cet exporter : aucune alerte RAID de cet hôte ne peut se déclencher."

      - alert: HwraidExporterAbsent
        # Filet global : aucune instance ne publie. Ne voit pas la perte d'une
        # instance parmi plusieurs (voir HwraidExporterDown).
        expr: absent(hwraid_snapshot_ready)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "hwraid_exporter ne publie plus de métriques"
          description: "Exporter arrêté ou non collecté par Prometheus : aucune alerte RAID ne peut se déclencher."
