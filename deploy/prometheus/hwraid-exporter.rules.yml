# Règles d'alerte d'exemple pour hwraid_exporter (docs/alerts.md).
# Les états sont repris sur 10 minutes (max_over_time) : une lecture en
# échec ponctuelle, qui retire les séries d'état, n'éteint pas une alerte
# de panne. La perte de visibilité est signalée par des règles séparées.
groups:
  - name: hwraid-etat
    rules:
      - alert: HwraidVolumeFailed
        expr: max_over_time(hwraid_volume_state{state="failed"}[10m]) == 1
        labels:
          severity: critical
        annotations:
          summary: "Volume RAID {{ $labels.volume }} en échec ({{ $labels.controller }})"
          description: "Le volume a perdu plus de membres que sa redondance ne le permet : données inaccessibles ou perdues."

      - alert: HwraidVolumeDegraded
        expr: max_over_time(hwraid_volume_state{state="degraded"}[10m]) == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Volume RAID {{ $labels.volume }} dégradé, sans reconstruction ({{ $labels.controller }})"
          description: "Le volume fonctionne sans redondance. Remplacer le disque en panne ; une seconde panne dans ce volume serait fatale."

      - alert: HwraidVolumeRebuilding
        expr: max_over_time(hwraid_volume_state{state="degraded_rebuilding"}[10m]) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Volume RAID {{ $labels.volume }} en reconstruction ({{ $labels.controller }})"
          description: "Redondance absente jusqu'à la fin de la reconstruction. Éviter toute intervention et toute coupure."

      - alert: HwraidVolumeStateUnknown
        expr: max_over_time(hwraid_volume_state{state="unknown"}[10m]) == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "État du volume {{ $labels.volume }} non déterminé ({{ $labels.controller }})"
          description: "La carte a répondu mais l'état n'est pas interprétable avec certitude (type non qualifié, membre non optimal sur un assemblage). Vérifier les volumes membres et l'outil du constructeur."

      - alert: HwraidDiskFailed
        expr: max_over_time(hwraid_disk_state{state="failed"}[10m]) == 1
        labels:
          severity: critical
        annotations:
          summary: "Disque {{ $labels.disk }} en panne ({{ $labels.controller }})"
          description: "Disque membre d'un volume mais absent de la carte."

      - alert: HwraidVolumeDisappeared
        expr: |
          (hwraid_volume_info offset 15m unless on (controller, volume) hwraid_volume_info)
          and on (controller) hwraid_collection_success{collector="volumes"} == 1
        labels:
          severity: warning
        annotations:
          summary: "Volume {{ $labels.volume }} disparu ({{ $labels.controller }})"
          description: "Le volume était présent il y a 15 minutes et n'apparaît plus alors que la lecture des volumes réussit : suppression ou perte du volume."

  - name: hwraid-protection-cache
    rules:
      - alert: HwraidCacheProtectionFailed
        expr: max_over_time(hwraid_cache_protection_state{state="failed"}[10m]) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Protection du cache en panne ({{ $labels.controller }})"
          description: "Le module de protection du cache ne protège plus les données en attente d'écriture. Si le cache d'écriture reste actif, une coupure de courant peut les perdre."

      - alert: HwraidCacheProtectionNotReady
        expr: max_over_time(hwraid_cache_protection_state{state="charging"}[10m]) == 1
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Protection du cache en charge depuis plus de 2 h ({{ $labels.controller }})"
          description: "Un module sain se charge en quelques minutes : une charge qui n'aboutit pas annonce une panne du module."

  - name: hwraid-visibilite
    rules:
      - alert: HwraidCollectionFailing
        expr: hwraid_collection_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Lecture {{ $labels.collector }} en échec ({{ $labels.controller }})"
          description: "L'exporter ne parvient plus à lire cette information : les alertes d'état correspondantes ne peuvent plus se déclencher. Voir le journal de l'exporter."

      - alert: HwraidManagementNodeInvalid
        expr: hwraid_management_node_valid == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nœud de gestion invalide ({{ $labels.controller }})"
          description: "Erreur de déploiement : le nœud de gestion ne désigne pas la carte attendue. Aucune lecture n'est faite."

      - alert: HwraidControllerUnsupported
        expr: hwraid_controller_backend_supported == 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Contrôleur {{ $labels.controller }} non pris en charge"
          description: "Aucun module ne sait lire cette carte : son état n'est pas surveillé."

      - alert: HwraidExporterAbsent
        expr: absent(hwraid_snapshot_ready)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "hwraid_exporter ne publie plus de métriques"
          description: "Exporter arrêté ou non collecté par Prometheus : aucune alerte RAID ne peut se déclencher."
