# Règles d'alerte d'exemple pour hwraid_exporter (docs/alerts.md).
#
# Règles d'état : l'état publié prime. La dernière valeur connue (sur
# 10 minutes) ne sert que lorsque l'objet n'a plus aucune série d'état, ce
# qui arrive pendant une lecture en échec : une panne ne s'éteint pas sur un
# trou de lecture, et un état passager ne prolonge pas l'alerte une fois
# l'objet revenu à un autre état.
#
# Toutes les jointures portent job et instance : deux hôtes peuvent publier
# le même identifiant de contrôleur (pci:0000:01:00.0).
groups:
  - name: hwraid-etat
    rules:
      - alert: HwraidVolumeFailed
        expr: |
          hwraid_volume_state{state="failed"} == 1
          or (last_over_time(hwraid_volume_state{state="failed"}[10m]) == 1
              unless on (job, instance, controller, volume) hwraid_volume_state)
        labels:
          severity: critical
        annotations:
          summary: "Volume RAID {{ $labels.volume }} en échec ({{ $labels.controller }})"
          description: "Le volume a perdu plus de membres que sa redondance ne le permet : données inaccessibles ou perdues."

      - alert: HwraidVolumeDegraded
        expr: |
          hwraid_volume_state{state="degraded"} == 1
          or (last_over_time(hwraid_volume_state{state="degraded"}[10m]) == 1
              unless on (job, instance, controller, volume) hwraid_volume_state)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Volume RAID {{ $labels.volume }} dégradé, sans reconstruction ({{ $labels.controller }})"
          description: "Le volume fonctionne sans redondance. Remplacer le disque en panne ; une seconde panne dans ce volume serait fatale."

      - alert: HwraidVolumeRebuilding
        expr: |
          hwraid_volume_state{state="degraded_rebuilding"} == 1
          or (last_over_time(hwraid_volume_state{state="degraded_rebuilding"}[10m]) == 1
              unless on (job, instance, controller, volume) hwraid_volume_state)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Volume RAID {{ $labels.volume }} en reconstruction ({{ $labels.controller }})"
          description: "Redondance absente jusqu'à la fin de la reconstruction. Éviter toute intervention et toute coupure."

      - alert: HwraidVolumeStateUnknown
        expr: |
          hwraid_volume_state{state="unknown"} == 1
          or (last_over_time(hwraid_volume_state{state="unknown"}[10m]) == 1
              unless on (job, instance, controller, volume) hwraid_volume_state)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "État du volume {{ $labels.volume }} non déterminé ({{ $labels.controller }})"
          description: "La carte a répondu mais l'état n'est pas interprétable avec certitude (type non qualifié, membre non optimal sur un assemblage). Vérifier les volumes membres et l'outil du constructeur."

      - alert: HwraidDiskFailed
        expr: |
          hwraid_disk_state{state="failed"} == 1
          or (last_over_time(hwraid_disk_state{state="failed"}[10m]) == 1
              unless on (job, instance, controller, disk) hwraid_disk_state)
        labels:
          severity: critical
        annotations:
          summary: "Disque {{ $labels.disk }} en panne ({{ $labels.controller }})"
          description: "Disque membre d'un volume mais absent de la carte."

      - alert: HwraidVolumeDisappeared
        # Volume vu dans les dernières 24 h, absent alors que la lecture des
        # volumes réussit. L'alerte dure 24 h : la mettre en silence après
        # une suppression volontaire.
        expr: |
          (last_over_time(hwraid_volume_info[1d])
              unless on (job, instance, controller, volume) hwraid_volume_info)
          and on (job, instance, controller) hwraid_collection_success{collector="volumes"} == 1
        labels:
          severity: warning
        annotations:
          summary: "Volume {{ $labels.volume }} disparu ({{ $labels.controller }})"
          description: "Le volume a été vu dans les dernières 24 heures et n'apparaît plus alors que la lecture des volumes réussit : suppression ou perte du volume."

  - name: hwraid-protection-cache
    rules:
      - alert: HwraidCacheProtectionFailed
        expr: |
          hwraid_cache_protection_state{state="failed"} == 1
          or (last_over_time(hwraid_cache_protection_state{state="failed"}[10m]) == 1
              unless on (job, instance, controller) hwraid_cache_protection_state
              unless on (job, instance, controller) hwraid_cache_protection_present == 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Protection du cache en panne ({{ $labels.controller }})"
          description: "Le module de protection du cache ne protège plus les données en attente d'écriture. Régler le cache d'écriture des volumes en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) pour qu'il reste coupé jusqu'au remplacement du module ; HwraidVolumeWriteCacheUnprotected signale un cache resté actif."

      - alert: HwraidCacheProtectionNotReady
        expr: |
          hwraid_cache_protection_state{state="charging"} == 1
          or (last_over_time(hwraid_cache_protection_state{state="charging"}[10m]) == 1
              unless on (job, instance, controller) hwraid_cache_protection_state
              unless on (job, instance, controller) hwraid_cache_protection_present == 0)
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Protection du cache en charge depuis plus de 2 h ({{ $labels.controller }})"
          description: "Un module sain se charge en quelques minutes : une charge qui n'aboutit pas annonce une panne du module."

      - alert: HwraidCacheProtectionStateUnknown
        expr: |
          hwraid_cache_protection_state{state="unknown"} == 1
          or (last_over_time(hwraid_cache_protection_state{state="unknown"}[10m]) == 1
              unless on (job, instance, controller) hwraid_cache_protection_state
              unless on (job, instance, controller) hwraid_cache_protection_present == 0)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "État de la protection du cache non déterminé ({{ $labels.controller }})"
          description: "Le module répond avec une combinaison d'état non qualifiée : sa protection n'est pas garantie. Vérifier avec l'outil du constructeur."

      # Cache d'écriture : volumes de premier niveau seulement (les volumes
      # assemblés portent le même réglage). Pendant une lecture en échec
      # (hwraid_collection_success à 0 ou absent), chaque série reprend sa
      # dernière valeur connue sur 10 minutes ; une lecture réussie ne garde
      # que les valeurs publiées.
      - alert: HwraidVolumeWriteCacheUnprotected
        expr: |
          (hwraid_volume_write_cache_enabled
              or (last_over_time(hwraid_volume_write_cache_enabled[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="volumes"} == 1)) == 1
            and on (job, instance, controller, volume) (hwraid_volume_info{parent=""}
              or (last_over_time(hwraid_volume_info{parent=""}[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="volumes"} == 1))
            and on (job, instance, controller) (
              (hwraid_cache_protection_state{state=~"failed|charging"}
              or (last_over_time(hwraid_cache_protection_state{state=~"failed|charging"}[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="cache_protection"} == 1)) == 1
              or (hwraid_cache_protection_present
              or (last_over_time(hwraid_cache_protection_present[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="cache_protection"} == 1)) == 0
            )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Cache d'écriture actif sans protection, volume {{ $labels.volume }} ({{ $labels.controller }})"
          description: "Le cache d'écriture du volume est actif alors que son module de protection est absent, en panne ou en charge : une coupure de courant, ou un redémarrage sans vidage du cache, perd les écritures en attente. Régler le cache en mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb) ou le désactiver."

      - alert: HwraidVolumeWriteCacheProtectionUnknown
        expr: |
          (hwraid_volume_write_cache_enabled
              or (last_over_time(hwraid_volume_write_cache_enabled[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="volumes"} == 1)) == 1
            and on (job, instance, controller, volume) (hwraid_volume_info{parent=""}
              or (last_over_time(hwraid_volume_info{parent=""}[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="volumes"} == 1))
            and on (job, instance, controller)
              (hwraid_cache_protection_state{state="unknown"}
              or (last_over_time(hwraid_cache_protection_state{state="unknown"}[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="cache_protection"} == 1)) == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Cache d'écriture actif, protection d'état indéterminé, volume {{ $labels.volume }} ({{ $labels.controller }})"
          description: "Le cache d'écriture du volume est actif et l'état du module de protection n'est pas qualifié : rien ne garantit que les écritures en attente survivent à une coupure. Vérifier le module avec l'outil du constructeur."

      - alert: HwraidVolumeWriteCacheUnknown
        # Lecture des volumes réussie, mais réglage ou état du cache non
        # reconnu : les autres alertes de cache ne peuvent pas se déclencher.
        expr: |
          (hwraid_volume_write_cache_policy{policy="unknown"} == 1
            or (hwraid_volume_write_cache_policy == 1
                unless on (job, instance, controller, volume) hwraid_volume_write_cache_enabled))
            and on (job, instance, controller, volume) hwraid_volume_info{parent=""}
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Réglage ou état du cache d'écriture non reconnu, volume {{ $labels.volume }} ({{ $labels.controller }})"
          description: "La carte décrit le cache d'écriture du volume avec une valeur non qualifiée : les alertes de cache d'écriture ne couvrent plus ce volume. Vérifier le cache avec l'outil du constructeur."

      - alert: HwraidVolumeWriteCacheAlwaysOn
        expr: |
          (hwraid_volume_write_cache_policy{policy="write_back_always"}
              or (last_over_time(hwraid_volume_write_cache_policy{policy="write_back_always"}[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="volumes"} == 1)) == 1
            and on (job, instance, controller, volume) (hwraid_volume_info{parent=""}
              or (last_over_time(hwraid_volume_info{parent=""}[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="volumes"} == 1))
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cache d'écriture forcé, volume {{ $labels.volume }} ({{ $labels.controller }})"
          description: "Le cache d'écriture reste actif même si le module de protection tombe en panne : une panne du module expose alors les écritures en attente. Préférer le mode « seulement si protégé » (Adaptec : ARCCONF SETCACHE … wbb)."

      - alert: HwraidVolumeWriteCacheInactive
        expr: |
          (hwraid_volume_write_cache_enabled
              or (last_over_time(hwraid_volume_write_cache_enabled[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="volumes"} == 1)) == 0
            and on (job, instance, controller, volume) (hwraid_volume_info{parent=""}
              or (last_over_time(hwraid_volume_info{parent=""}[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="volumes"} == 1))
            and on (job, instance, controller, volume)
              (hwraid_volume_write_cache_policy{policy=~"write_back_always|write_back_when_protected"}
              or (last_over_time(hwraid_volume_write_cache_policy{policy=~"write_back_always|write_back_when_protected"}[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="volumes"} == 1)) == 1
            and on (job, instance, controller)
              (hwraid_cache_protection_state{state="optimal"}
              or (last_over_time(hwraid_cache_protection_state{state="optimal"}[10m])
                  unless on (job, instance, controller) hwraid_collection_success{collector="cache_protection"} == 1)) == 1
        for: 2h
        labels:
          severity: info
        annotations:
          summary: "Cache d'écriture inactif malgré une protection opérationnelle, volume {{ $labels.volume }} ({{ $labels.controller }})"
          description: "Le réglage demande un cache d'écriture et le module de protection est opérationnel, mais la carte n'a pas réactivé le cache : écritures plus lentes. Vérifier l'état du cache avec l'outil du constructeur."

  - name: hwraid-visibilite
    rules:
      - alert: HwraidCollectionStale
        # S'adapte à l'intervalle configuré : aucun succès depuis plus de
        # trois cycles de collecte (lecture en échec ou hors délai).
        expr: |
          time() - hwraid_collection_last_success_timestamp_seconds
            > on (job, instance, controller) group_left 3 * hwraid_collection_interval_seconds
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Lecture {{ $labels.collector }} sans succès depuis plus de 3 cycles ({{ $labels.controller }})"
          description: "L'exporter ne parvient plus à lire cette information : les alertes d'état correspondantes ne peuvent plus se déclencher. Voir le journal de l'exporter ; « cannot allocate memory » sur toutes les lectures signale probablement la réserve de commandes du pilote aacraid épuisée : le prochain redémarrage ne videra pas le cache de la carte, suivre docs/aacraid-defaut-pilote.md avant de redémarrer."

      - alert: HwraidCollectionNeverSucceeded
        # Lecture en échec qui n'a jamais réussi depuis le démarrage (pas de
        # date de dernier succès).
        expr: |
          hwraid_collection_success == 0
            unless on (job, instance, controller, collector) hwraid_collection_last_success_timestamp_seconds
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Lecture {{ $labels.collector }} jamais réussie ({{ $labels.controller }})"
          description: "Depuis son démarrage, l'exporter n'a jamais réussi cette lecture. Voir le journal de l'exporter ; « cannot allocate memory » sur toutes les lectures signale probablement la réserve de commandes du pilote aacraid épuisée : le prochain redémarrage ne videra pas le cache de la carte, suivre docs/aacraid-defaut-pilote.md avant de redémarrer."

      - alert: HwraidCollectionIntervalTooLong
        # Les règles d'état retiennent la dernière valeur sur 10 min : elles
        # ne couvrent un cycle en échec que si l'intervalle est d'au plus 5 min.
        expr: hwraid_collection_interval_seconds > 300
        labels:
          severity: info
        annotations:
          summary: "Intervalle de collecte de {{ $value }} s : allonger les fenêtres des règles d'état ({{ $labels.controller }})"
          description: "Les règles d'état retiennent la dernière valeur connue sur 10 minutes, soit au moins deux cycles pour un intervalle de 5 minutes au plus. Au-delà, passer ces fenêtres à au moins deux fois l'intervalle."

      - alert: HwraidManagementNodeInvalid
        expr: hwraid_management_node_valid == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nœud de gestion invalide ({{ $labels.controller }})"
          description: "Le nœud de gestion n'a pas pu être vérifié ou ne désigne pas la carte attendue (erreur de déploiement, carte changée). Aucune lecture n'est faite."

      - alert: HwraidControllerUnsupported
        expr: hwraid_controller_backend_supported == 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Contrôleur {{ $labels.controller }} non pris en charge"
          description: "Aucun module ne sait lire cette carte : son état n'est pas surveillé."

      - alert: HwraidControllerDisappeared
        # Contrôleur vu dans les dernières 24 h, absent alors que la
        # découverte réussit. Un changement d'identité (numéro de série
        # devenu illisible au démarrage) le déclenche aussi.
        expr: |
          (last_over_time(hwraid_controller_info[1d])
              unless on (job, instance, controller) hwraid_controller_info)
          and on (job, instance) hwraid_discovery_success == 1
        labels:
          severity: warning
        annotations:
          summary: "Contrôleur {{ $labels.controller }} disparu"
          description: "La carte a été vue dans les dernières 24 heures et n'est plus découverte : carte retirée, pilote déchargé ou identité changée."

      - alert: HwraidDiscoveryFailed
        expr: hwraid_discovery_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Découverte des contrôleurs en échec ({{ $labels.instance }})"
          description: "L'exporter ne parvient pas à lire tout ou partie de l'inventaire sysfs : une carte peut ne plus être surveillée. Voir le journal de l'exporter."

      - alert: HwraidSnapshotNotReady
        expr: hwraid_snapshot_ready == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Aucune collecte publiée ({{ $labels.instance }})"
          description: "L'exporter répond mais n'a encore publié aucun résultat de collecte. Voir le journal de l'exporter."

      - alert: HwraidExporterDown
        # Instance qui a publié des métriques hwraid dans les dernières 24 h
        # et que Prometheus n'arrive plus à collecter. Une cible retirée de
        # la configuration de Prometheus n'a plus de série up : elle n'est
        # pas vue par cette règle.
        expr: up == 0 and on (job, instance) last_over_time(hwraid_snapshot_ready[1d])
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "hwraid_exporter injoignable ({{ $labels.instance }})"
          description: "Prometheus ne collecte plus cet exporter : aucune alerte RAID de cet hôte ne peut se déclencher."

      - alert: HwraidExporterAbsent
        # Filet global : aucune instance ne publie. Ne voit pas la perte d'une
        # instance parmi plusieurs (voir HwraidExporterDown).
        expr: absent(hwraid_snapshot_ready)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "hwraid_exporter ne publie plus de métriques"
          description: "Exporter arrêté ou non collecté par Prometheus : aucune alerte RAID ne peut se déclencher."
