name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Contenu publiable
        run: sh scripts/check-public.sh

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -race -count=1 ./...

      - name: Tests root (privilèges, nœuds)
        run: |
          mkdir -p dist/roottests
          for p in ./internal/privilege ./internal/nodes; do
            CGO_ENABLED=0 go test -c -o "dist/roottests/$(basename "$p").test" "$p"
          done
          for t in dist/roottests/*.test; do
            sudo env HWRAID_REQUIRE_ROOT_TESTS=1 "$t" -test.v -test.count=1
          done

      - name: Tests root au profil du conteneur (capacités réduites)
        run: |
          docker run --rm --read-only \
            --cap-drop ALL --cap-add MKNOD --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --cap-add SYS_RAWIO \
            --device-cgroup-rule 'c *:* r' --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,dev,size=64m \
            -v "$PWD/dist/roottests:/t:ro" alpine:3.20 \
            sh -ec 'grep -E "^Cap(Eff|Bnd)" /proc/self/status; for t in /t/*.test; do HWRAID_REQUIRE_ROOT_TESTS=1 "$t" -test.v -test.count=1; done'

      - name: Vulnérabilités connues
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Binaire statique
        run: |
          CGO_ENABLED=0 go build -trimpath -o dist/hwraid-exporter ./cmd/hwraid-exporter
          if readelf -l dist/hwraid-exporter | grep -q 'Requesting program interpreter'; then
            echo "le binaire dépend d'un interpréteur dynamique" >&2; exit 1
          fi

      - name: Bout en bout (serve en root, sans carte)
        run: |
          sudo dist/hwraid-exporter serve --listen 127.0.0.1:9799 --interval 2s > serve.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9799/metrics > metrics.txt 2>/dev/null && grep -q '^hwraid_snapshot_ready 1$' metrics.txt && break; sleep 0.5; done
          cat serve.log; cat metrics.txt
          grep -qx 'hwraid_snapshot_ready 1' metrics.txt
          grep -qx 'hwraid_discovery_success 1' metrics.txt
          pid=$(pgrep -f 'hwraid-exporter serve' | grep -v sudo | while read p; do [ "$(ps -o comm= -p $p)" = hwraid-exporter ] && echo $p; done | head -1)
          grep -E '^(Uid|Gid|Groups|Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs):' /proc/$pid/status | tee status.txt
          grep -qE '^Groups:\s*$' status.txt
          grep -qE '^Uid:\s+65534\s+65534\s+65534\s+65534$' status.txt
          # Sans carte prise en charge : aucune capacité conservée.
          grep -qE '^Gid:\s+65534\s+65534\s+65534\s+65534$' status.txt
          for set in CapInh CapPrm CapEff CapBnd CapAmb; do grep -qE "^$set:\s+0000000000000000$" status.txt; done
          grep -qE '^NoNewPrivs:\s+1$' status.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9799/autre)" = 404
          sudo kill -TERM $pid
          for i in $(seq 1 20); do kill -0 $pid 2>/dev/null || break; sleep 0.25; done
          ! kill -0 $pid 2>/dev/null

      - name: Conteneur Docker au profil du NAS (sans carte)
        run: |
          docker run -d --name hw --read-only \
            --cap-drop ALL --cap-add MKNOD --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --cap-add SYS_RAWIO \
            --device-cgroup-rule 'c *:* r' --security-opt no-new-privileges \
            -p 127.0.0.1:9800:9799 -v "$PWD/dist/hwraid-exporter:/hwraid-exporter:ro" \
            alpine:3.20 /hwraid-exporter serve --listen 0.0.0.0:9799 --interval 2s
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9800/metrics > cmetrics.txt 2>/dev/null && grep -q '^hwraid_snapshot_ready 1$' cmetrics.txt && break; sleep 0.5; done
          docker logs hw; cat cmetrics.txt
          grep -qx 'hwraid_snapshot_ready 1' cmetrics.txt
          docker exec hw grep -E '^(Uid|Gid|Groups|Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs):' /proc/1/status | tee cstatus.txt
          grep -qE '^Uid:\s+65534\s+65534\s+65534\s+65534$' cstatus.txt
          for set in CapInh CapPrm CapEff CapBnd CapAmb; do grep -qE "^$set:\s+0000000000000000$" cstatus.txt; done
          grep -qE '^NoNewPrivs:\s+1$' cstatus.txt
          docker exec hw ls -ld /dev/hwraid_exporter
          docker stop -t 10 hw
          test "$(docker inspect -f '{{.State.ExitCode}}' hw)" = 0
