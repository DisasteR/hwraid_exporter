name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Appelée par la publication : la suite complète sur le commit tagué.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # tags pour git describe
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Contenu publiable
        run: sh scripts/check-public.sh

      - name: En-têtes de licence
        run: sh scripts/check-license-headers.sh

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Outil de capture fibcap
        run: sh tools/fibcap/test.sh

      - name: Règles d'alerte (promtool)
        run: docker run --rm --network none -v "$PWD/deploy/prometheus":/r:ro -w /r --entrypoint promtool prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038 test rules hwraid-exporter.rules.test.yml

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -race -count=1 ./...

      - name: Tests root (privilèges, nœuds)
        run: |
          mkdir -p dist/roottests
          for p in ./internal/privilege ./internal/nodes; do
            CGO_ENABLED=0 go test -c -o "dist/roottests/$(basename "$p").test" "$p"
          done
          for t in dist/roottests/*.test; do
            sudo env HWRAID_REQUIRE_ROOT_TESTS=1 "$t" -test.v -test.count=1
          done

      - name: Tests root au profil du conteneur (capacités réduites)
        run: |
          docker run --rm --read-only \
            --cap-drop ALL --cap-add MKNOD --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --cap-add SYS_RAWIO \
            --device-cgroup-rule 'c *:* r' --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,dev,size=64m \
            -v "$PWD/dist/roottests:/t:ro" alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc \
            sh -ec 'grep -E "^Cap(Eff|Bnd)" /proc/self/status; for t in /t/*.test; do HWRAID_REQUIRE_ROOT_TESTS=1 "$t" -test.v -test.count=1; done'

      - name: Vulnérabilités connues
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Binaire statique
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=$(git describe --tags --always --dirty) -X main.revision=$GITHUB_SHA" -o dist/hwraid-exporter ./cmd/hwraid-exporter
          test "$(dist/hwraid-exporter version)" = "$(git describe --tags --always --dirty)"
          if readelf -l dist/hwraid-exporter | grep -q 'Requesting program interpreter'; then
            echo "le binaire dépend d'un interpréteur dynamique" >&2; exit 1
          fi

      - name: Bout en bout (serve en root, sans carte)
        run: |
          sudo dist/hwraid-exporter serve --listen 127.0.0.1:9799 --interval 2s > serve.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9799/metrics > metrics.txt 2>/dev/null && grep -q '^hwraid_snapshot_ready 1$' metrics.txt && break; sleep 0.5; done
          cat serve.log; cat metrics.txt
          grep -qx 'hwraid_snapshot_ready 1' metrics.txt
          grep -qx 'hwraid_discovery_success 1' metrics.txt
          pid=$(pgrep -f 'hwraid-exporter serve' | grep -v sudo | while read p; do [ "$(ps -o comm= -p $p)" = hwraid-exporter ] && echo $p; done | head -1)
          grep -E '^(Uid|Gid|Groups|Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs):' /proc/$pid/status | tee status.txt
          grep -qE '^Groups:\s*$' status.txt
          grep -qE '^Uid:\s+65534\s+65534\s+65534\s+65534$' status.txt
          # Sans carte prise en charge : aucune capacité conservée.
          grep -qE '^Gid:\s+65534\s+65534\s+65534\s+65534$' status.txt
          for set in CapInh CapPrm CapEff CapBnd CapAmb; do grep -qE "^$set:\s+0000000000000000$" status.txt; done
          grep -qE '^NoNewPrivs:\s+1$' status.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9799/autre)" = 404
          sudo kill -TERM $pid
          # Le processus tourne sous l'UID 65534 : kill -0 sans sudo échouerait
          # par refus de permission, pas parce qu'il est arrêté.
          for i in $(seq 1 20); do sudo kill -0 $pid 2>/dev/null || break; sleep 0.25; done
          if sudo kill -0 $pid 2>/dev/null; then echo "processus toujours actif après SIGTERM" >&2; exit 1; fi

      - name: Unité systemd (sans carte)
        run: |
          sudo install -m 0755 dist/hwraid-exporter /usr/local/bin/hwraid-exporter
          sudo install -m 0644 deploy/systemd/hwraid-exporter.service /etc/systemd/system/
          systemd-analyze verify /etc/systemd/system/hwraid-exporter.service
          sudo systemctl daemon-reload
          sudo systemctl start hwraid-exporter
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9799/metrics > sd.txt 2>/dev/null && grep -q '^hwraid_snapshot_ready 1$' sd.txt && break; sleep 0.5; done
          sudo journalctl -u hwraid-exporter --no-pager -o cat | tee sd.log
          grep -qx 'hwraid_snapshot_ready 1' sd.txt
          grep -qx 'hwraid_discovery_success 1' sd.txt
          pid=$(systemctl show -p MainPID --value hwraid-exporter)
          grep -E '^(Uid|Gid|Groups|CapEff|CapBnd|NoNewPrivs|Seccomp):' /proc/$pid/status | tee sds.txt
          grep -qE '^Uid:\s+65534\s+65534\s+65534\s+65534$' sds.txt
          grep -qE '^NoNewPrivs:\s+1$' sds.txt
          grep -qE '^Seccomp:\s+2$' sds.txt
          if grep -qiE 'operation not permitted|level=ERROR' sd.log; then echo "erreur au journal de l'unité" >&2; exit 1; fi
          systemd-analyze security hwraid-exporter --no-pager | tail -1
          sudo systemctl stop hwraid-exporter
          test "$(systemctl show -p Result --value hwraid-exporter)" = success

      - name: Conteneur Docker au profil du NAS (sans carte)
        run: |
          docker run -d --name hw --read-only \
            --cap-drop ALL --cap-add MKNOD --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --cap-add SYS_RAWIO \
            --device-cgroup-rule 'c *:* r' --security-opt no-new-privileges \
            -p 127.0.0.1:9800:9799 -v "$PWD/dist/hwraid-exporter:/hwraid-exporter:ro" \
            alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc /hwraid-exporter serve --listen 0.0.0.0:9799 --interval 2s
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9800/metrics > cmetrics.txt 2>/dev/null && grep -q '^hwraid_snapshot_ready 1$' cmetrics.txt && break; sleep 0.5; done
          docker logs hw; cat cmetrics.txt
          grep -qx 'hwraid_snapshot_ready 1' cmetrics.txt
          docker exec hw grep -E '^(Uid|Gid|Groups|Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs):' /proc/1/status | tee cstatus.txt
          grep -qE '^Uid:\s+65534\s+65534\s+65534\s+65534$' cstatus.txt
          for set in CapInh CapPrm CapEff CapBnd CapAmb; do grep -qE "^$set:\s+0000000000000000$" cstatus.txt; done
          grep -qE '^NoNewPrivs:\s+1$' cstatus.txt
          docker exec hw ls -ld /dev/hwraid_exporter
          docker stop -t 10 hw
          test "$(docker inspect -f '{{.State.ExitCode}}' hw)" = 0
