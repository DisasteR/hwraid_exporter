name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Contenu publiable
        run: sh scripts/check-public.sh

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -race -count=1 ./...

      - name: Vulnérabilités connues
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Binaire statique
        run: |
          CGO_ENABLED=0 go build -trimpath -o dist/hwraid-exporter ./cmd/hwraid-exporter
          if readelf -l dist/hwraid-exporter | grep -q 'Requesting program interpreter'; then
            echo "le binaire dépend d'un interpréteur dynamique" >&2; exit 1
          fi
