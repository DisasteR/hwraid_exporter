name: release

# Publication sur un tag de version (vX.Y.Z) seulement, après la suite CI
# complète sur le commit tagué. Une version publiée n'est jamais remplacée :
# si l'image existe déjà pour ce commit (publication interrompue), seule la
# publication GitHub est terminée ; pour un autre commit, refus.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publication GitHub (binaire, SHA-256)
      packages: write # image GHCR
    env:
      IMAGE: ghcr.io/disaster/hwraid_exporter
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag de version sur main
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          grep -q "^## $TAG " CHANGELOG.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "la publication GitHub $TAG existe déjà" >&2; exit 1
          fi

      - name: État du registre
        id: registry
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if out=$(docker manifest inspect "$IMAGE:$TAG" 2>&1); then
            docker pull -q "$IMAGE:$TAG"
            rev=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE:$TAG")
            if [ "$rev" != "$GITHUB_SHA" ]; then
              echo "$IMAGE:$TAG existe pour le commit $rev, pas $GITHUB_SHA : refus" >&2; exit 1
            fi
            echo "image déjà publiée pour ce commit : reprise"
            echo "mode=resume" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -qiE 'manifest unknown|not found'; then
            echo "mode=new" >> "$GITHUB_OUTPUT"
          else
            echo "réponse inattendue du registre : $out" >&2; exit 1
          fi

      - name: Construction
        if: steps.registry.outputs.mode == 'new'
        run: docker build --build-arg VERSION="$TAG" --build-arg REVISION="$GITHUB_SHA" -t "$IMAGE:$TAG" .

      - name: Essai de l'image au profil du NAS (sans carte)
        run: |
          docker run -d --name hw --read-only \
            --cap-drop ALL --cap-add MKNOD --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --cap-add SYS_RAWIO \
            --device-cgroup-rule 'c *:* r' --security-opt no-new-privileges \
            -p 127.0.0.1:9800:9799 "$IMAGE:$TAG"
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9800/metrics > m.txt 2>/dev/null && grep -q '^hwraid_snapshot_ready 1$' m.txt && break; sleep 0.5; done
          docker logs hw; cat m.txt
          grep -qx 'hwraid_snapshot_ready 1' m.txt
          grep -q "^hwraid_exporter_build_info{version=\"$TAG\",revision=\"$GITHUB_SHA\"," m.txt
          pid=$(docker inspect -f '{{.State.Pid}}' hw)
          grep -qE '^Uid:\s+65534\s+65534\s+65534\s+65534$' /proc/$pid/status
          grep -qE '^NoNewPrivs:\s+1$' /proc/$pid/status
          docker rm -f hw

      - name: Binaire de l'image et somme SHA-256
        run: |
          mkdir -p dist
          id=$(docker create "$IMAGE:$TAG")
          docker cp "$id:/hwraid-exporter" "dist/hwraid-exporter-$TAG-linux-amd64"
          # Licences de ce qui est compilé dans le binaire (mêmes fichiers
          # que /licenses dans l'image), distribuées avec lui.
          docker cp "$id:/licenses" dist/licenses
          docker rm "$id"
          test -f dist/licenses/hwraid_exporter/LICENSE && test -f dist/licenses/go/LICENSE
          tar -C dist -czf "dist/hwraid-exporter-$TAG-licenses.tar.gz" licenses
          test "$(dist/hwraid-exporter-$TAG-linux-amd64 version)" = "$TAG"
          # Unité systemd du tag, pour une installation sans les sources.
          cp deploy/systemd/hwraid-exporter.service dist/hwraid-exporter.service
          (cd dist && sha256sum hwraid-exporter-*-linux-amd64 hwraid-exporter-*-licenses.tar.gz hwraid-exporter.service > SHA256SUMS && cat SHA256SUMS)

      - name: Publication de l'image
        if: steps.registry.outputs.mode == 'new'
        run: docker push "$IMAGE:$TAG"

      - name: Publication GitHub
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")
          awk -v t="## $TAG " 'index($0, t) == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          printf '\nImage : `%s`\n' "$digest" >> notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            "dist/hwraid-exporter-$TAG-linux-amd64" "dist/hwraid-exporter-$TAG-licenses.tar.gz" dist/hwraid-exporter.service dist/SHA256SUMS
